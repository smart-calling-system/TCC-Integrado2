name: tcc_face
description: >-
  Frontend do Sistema de Controle de Presenca Escolar baseado em
  Reconhecimento Facial. Interface desenvolvida em Flutter com dados
  mockados, preparada para futura integracao com o backend (attendance-api).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Gerenciamento de estado leve, utilizado pelos controllers/providers.
  provider: ^6.1.2

  # Icones nativos do Material (cupertino incluso por padrao do template).
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
